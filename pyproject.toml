[project]
name = "lib-common"
version = "0.3.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "huncidd", email = "38997460@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.128.0",
    "loguru>=0.7.3",
    "pandas>=2.3.3",
    "pycryptodome>=3.23.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.11.0",
    "pytz>=2025.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.46",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]


[tool.ruff]
line-length = 120
indent-width = 4
include = ["pyproject.toml", "**/*.py"]
exclude = [".venv"]

[tool.ruff.lint]  # 新增 lint 模块
select = [
    "F",
    "E",
    "W",
    "UP",
]
ignore = [
    "UP035",
    "UP037",
    "UP006",
    "UP046"
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
